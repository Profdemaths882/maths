/* ================= 4e · Géométrie dans l'espace ================= */
function gESsph(){const [a,b,c]=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]]);const mode=Math.random()<.5;
  if(mode)return mkQ({skill:"Section d'une sphère",q:`Une sphère de centre O et de rayon ${c} cm est coupée par un plan situé à ${a} cm de O. Calcule le rayon du cercle de section.`,good:cm(b),bad:[{h:cm(c-a),why:"r² = R² − d² (Pythagore), pas R − d."},{h:cm(Math.round(Math.sqrt(c*c+a*a)*100)/100),why:"On soustrait : r² = R² − d²."},{h:cm(c*c-a*a),why:"Ça, c'est r² : prends la racine."}],hint:"r² = R² − d².",
    corr:[`Le centre O, le centre H du cercle de section et un point M du cercle forment un triangle rectangle en H.`,`D'après Pythagore : ${m('r<sup>2</sup> = R<sup>2</sup> − d<sup>2</sup> = '+c*c+' − '+a*a+' = '+b*b)}.`,`D'où <b>r = ${b} cm</b>.`]});
  return mkQ({skill:"Section d'une sphère",q:`Un plan passant par le centre d'une sphère de rayon ${c} cm la coupe selon un cercle de rayon :`,good:cm(c),bad:[{h:cm(c/2),why:"Le plan passe par le centre : d = 0, donc r = R (grand cercle)."},{h:cm(2*c),why:"r ne peut pas dépasser R."},{h:"0 cm",why:"Le plan passe par le centre : c'est un grand cercle."}],hint:"d = 0.",corr:[`Le plan passe par le centre : d = 0, donc ${m('r = R')}.`,`D'où <b>${cm(c)}</b> : c'est un grand cercle.`]})}
const ESP4_Q=[["Une droite est perpendiculaire à un plan si elle est perpendiculaire à :","deux droites sécantes de ce plan",["une seule droite de ce plan","deux droites parallèles de ce plan","aucune droite du plan"],"Une droite est perpendiculaire à un plan si elle est perpendiculaire à deux droites sécantes de ce plan ; elle est alors orthogonale à toutes les droites du plan."],
  ["Dans un cube ABCDEFGH, l'arête [AE] est :","perpendiculaire au plan de la face ABCD",["parallèle au plan ABCD","contenue dans le plan ABCD","sécante non perpendiculaire à ABCD"],"Les arêtes verticales d'un cube sont perpendiculaires aux faces horizontales."],
  ["Deux droites de l'espace qui ne sont ni parallèles ni sécantes sont dites :","non coplanaires",["perpendiculaires","confondues","sécantes"],"Dans l'espace, deux droites peuvent ne pas être dans un même plan : elles sont non coplanaires."]];
function coursESP4(){
  return bulle("Géométrie dans l'espace",`<p>Dans l'espace, deux droites peuvent ne jamais se couper sans être parallèles ! Utilise le cube et le pavé pour visualiser.</p>`)+
  lesson('1.',"Droites et plans",retenir('À retenir',`<p>Deux droites de l'espace peuvent être sécantes, parallèles ou non coplanaires. Deux droites sont <b>orthogonales</b> si leurs parallèles menées par un même point sont perpendiculaires.</p>`))+
  lesson('2.',"Droite perpendiculaire à un plan, plans parallèles",retenir('Propriétés',`<p>Une droite perpendiculaire à deux droites sécantes d'un plan est perpendiculaire à ce plan. Deux plans perpendiculaires à une même droite sont parallèles.</p>`))+
  lesson('3.',"Section d'une sphère par un plan",retenir('Propriété',`<p>La section d'une sphère de centre O et de rayon R par un plan situé à la distance d de O (d &lt; R) est un cercle de rayon ${m('r = '+SQ('R<sup>2</sup> − d<sup>2</sup>'))}.</p>`))+
  `<button class="btn gold wide" data-act="tab" data-t="train">Je m'entraîne</button>`;
}
REG['4e-ESP']={cours:coursESP4,geo:true,skills:[["pos","Droites et plans",qcmFix("Droites et plans",ESP4_Q)],["sph","Section d'une sphère",gESsph]],
  serie:()=>[qcmFix("Droites et plans",ESP4_Q)(),qcmFix("Droites et plans",ESP4_Q)(),qcmFix("Droites et plans",ESP4_Q)(),gESsph(),gESsph(),gESsph(),gESsph(),gESsph(),qcmFix("Droites et plans",ESP4_Q)(),gESsph()]};

/* ================= 3e · Inéquations à deux inconnues ================= */
function gINSver(){const a=nz(-5,5),b=nz(-5,5),c=nz(-9,9),x=nz(-5,5),y=nz(-5,5),op=pick(['≤','&gt;']);const v=a*x+b*y+c,ok=op==='≤'?v<=0:v>0;
  const E=lin2(a,b,0).replace(' = 0','')+(c<0?' − '+(-c):' + '+c);
  return mkQ({skill:"Vérifier un couple",q:`Le couple (${N(x)} ; ${N(y)}) est-il solution de ${m(E+' '+op+' 0')} ?`,list:[{h:"Oui",ok,why:"Remplace x et y, puis compare à 0."},{h:"Non",ok:!ok,why:"Remplace x et y, puis compare à 0."}],hint:"Remplace x et y.",
  corr:[`${m(N(a)+' × '+PN(x)+' + '+PN(b)+' × '+PN(y)+' + '+PN(c)+' = '+N(v))}.`,`Or ${N(v)} ${v<=0?'≤':'&gt;'} 0.`,`Donc <b>${ok?'oui':'non'}</b>.`]})}
const INS_Q=[["L'ensemble des solutions d'une inéquation du type ax + by + c ≤ 0 est représenté par :","un demi-plan limité par la droite d'équation ax + by + c = 0",["une droite","un point","un segment"],"La droite ax + by + c = 0 partage le plan en deux demi-plans ; on garde celui dont un point test vérifie l'inéquation."],
  ["Pour savoir quel demi-plan correspond à l'inéquation, on :","teste un point (souvent l'origine) qui n'est pas sur la droite",["mesure la droite","trace une parallèle","compte les carreaux"],"On remplace les coordonnées d'un point test (souvent O) : s'il vérifie l'inéquation, on garde son demi-plan."],
  ["La solution d'un système de deux inéquations à deux inconnues est :","l'intersection des deux demi-plans solutions",["la réunion des deux demi-plans","le point d'intersection des droites","une seule droite"],"On résout chaque inéquation, puis on garde la partie du plan commune aux deux (on hachure souvent ce qu'on rejette)."]];
function coursINS(){
  return bulle('Inéquations à deux inconnues',`<p>Une inéquation à deux inconnues se résout <b>graphiquement</b> : sa solution est un demi-plan.</p>`)+
  lesson('1.',"Inéquation ax + by + c ≤ 0",retenir('Méthode',`<p>1. On trace la droite (D) d'équation ax + by + c = 0.</p><p>2. On teste un point qui n'est pas sur (D), par exemple O(0 ; 0).</p><p>3. S'il vérifie l'inéquation, la solution est le demi-plan qui contient ce point ; sinon, l'autre. On hachure la partie rejetée.</p>`))+
  lesson('2.',"Systèmes d'inéquations",retenir('À retenir',`<p>On résout graphiquement chaque inéquation ; la solution du système est la partie du plan <b>commune</b> (non hachurée).</p>`))+
  `<button class="btn gold wide" data-act="tab" data-t="train">Je m'entraîne</button>`;
}
REG['3e-INS']={cours:coursINS,skills:[["ver","Vérifier un couple",gINSver],["dp","Demi-plans",qcmFix("Demi-plans",INS_Q)]],
  serie:()=>[gINSver(),gINSver(),gINSver(),gINSver(),gINSver(),gINSver(),qcmFix("Demi-plans",INS_Q)(),qcmFix("Demi-plans",INS_Q)(),qcmFix("Demi-plans",INS_Q)(),gINSver()]};

/* ================= 3e · Repérage dans le plan ================= */
function gRPvec(){const xa=nz(-6,6),ya=nz(-6,6),xb=nz(-6,6),yb=nz(-6,6);
  return mkQ({skill:"Coordonnées d'un vecteur",q:`A(${N(xa)} ; ${N(ya)}) et B(${N(xb)} ; ${N(yb)}). Quelles sont les coordonnées de ${m(VEC('AB'))} ?`,good:m(VEC('AB')+'('+N(xb-xa)+' ; '+N(yb-ya)+')'),
    bad:[{h:m(VEC('AB')+'('+N(xa-xb)+' ; '+N(ya-yb)+')'),why:"Coordonnées de AB : (x_B − x_A ; y_B − y_A) — arrivée moins départ."},{h:m(VEC('AB')+'('+N(xa+xb)+' ; '+N(ya+yb)+')'),why:"On soustrait, on n'additionne pas."},{h:m(VEC('AB')+'('+N(yb-ya)+' ; '+N(xb-xa)+')'),why:"Abscisse d'abord."}],hint:"Arrivée moins départ.",
    corr:[`${m(VEC('AB')+'(x<sub>B</sub> − x<sub>A</sub> ; y<sub>B</sub> − y<sub>A</sub>)')}.`,`${m(VEC('AB')+'('+N(xb)+' − '+PN(xa)+' ; '+N(yb)+' − '+PN(ya)+')')}.`,`D'où <b>${m(VEC('AB')+'('+N(xb-xa)+' ; '+N(yb-ya)+')')}</b>.`]})}
function gRPcol(){const a=nz(-5,5),b=nz(-5,5),k=pick([2,3,-2,-1]),col=Math.random()<.5;const c=col?k*a:k*a+pick([1,-1]),d=k*b;const det=a*d-b*c;
  return mkQ({skill:"Colinéarité et orthogonalité",q:`${m(VEC('u')+'('+N(a)+' ; '+N(b)+')')} et ${m(VEC('v')+'('+N(c)+' ; '+N(d)+')')}. Ces vecteurs sont-ils colinéaires ?`,list:[{h:"Oui",ok:det===0,why:"Calcule xy' − x'y."},{h:"Non",ok:det!==0,why:"Calcule xy' − x'y."}],hint:"Colinéaires ⇔ xy' − x'y = 0.",
    corr:[`${m("xy' − x'y = "+N(a)+' × '+PN(d)+' − '+PN(c)+' × '+PN(b)+' = '+N(det))}.`,det===0?`Le résultat est nul : <b>les vecteurs sont colinéaires</b>.`:`Le résultat n'est pas nul : <b>les vecteurs ne sont pas colinéaires</b>.`]})}
function gRPorth(){const a=nz(-5,5),b=nz(-5,5),orth=Math.random()<.5,k=nz(-2,2);const c=orth?-b*k:-b*k+1,d=a*k;const ps=a*c+b*d;
  return mkQ({skill:"Colinéarité et orthogonalité",q:`${m(VEC('u')+'('+N(a)+' ; '+N(b)+')')} et ${m(VEC('v')+'('+N(c)+' ; '+N(d)+')')}. Ces vecteurs sont-ils orthogonaux ?`,list:[{h:"Oui",ok:ps===0,why:"Calcule xx' + yy'."},{h:"Non",ok:ps!==0,why:"Calcule xx' + yy'."}],hint:"Orthogonaux ⇔ xx' + yy' = 0 (repère orthonormé).",
    corr:[`${m("xx' + yy' = "+N(a)+' × '+PN(c)+' + '+PN(b)+' × '+PN(d)+' = '+N(ps))}.`,ps===0?`Le résultat est nul : <b>les vecteurs sont orthogonaux</b>.`:`Le résultat n'est pas nul : <b>ils ne sont pas orthogonaux</b>.`]})}
function gRPeq(){let xa,ya,xb,yb;do{xa=nz(-5,5);xb=nz(-5,5);ya=nz(-6,6);yb=nz(-6,6)}while(xa===xb);const a=F(yb-ya,xb-xa),b=F(ya*a.d-a.n*xa,a.d);
  const eq=(a,b)=>'y = '+(a.n===0?'':(a.d===1&&Math.abs(a.n)===1?(a.n<0?'−':''):H(a))+'x')+(b.n===0?(a.n===0?'0':''):(a.n===0?H(b):(b.n<0?' − '+H(fneg(b)):' + '+H(b))));
  return mkQ({skill:"Équation de droite",q:`Quelle est l'équation réduite de la droite (AB), avec A(${N(xa)} ; ${N(ya)}) et B(${N(xb)} ; ${N(yb)}) ?`,good:m(eq(a,b)),
    bad:[{h:m(eq(F(xb-xa,yb-ya===0?1:yb-ya),b)),why:"Coefficient directeur : a = (y_B − y_A) ÷ (x_B − x_A)."},{h:m(eq(fneg(a),b)),why:"Erreur de signe sur le coefficient directeur."},{h:m(eq(a,fneg(b))),why:"Vérifie b avec les coordonnées de A : b = y_A − a × x_A."}],
    hint:"a = (y_B − y_A) ÷ (x_B − x_A), puis b = y_A − a x_A.",corr:[`${m('a = '+FR('y<sub>B</sub> − y<sub>A</sub>','x<sub>B</sub> − x<sub>A</sub>')+' = '+FR(N(yb-ya),N(xb-xa))+' = '+H(a))}.`,`A appartient à la droite : ${m('b = y<sub>A</sub> − a x<sub>A</sub> = '+N(ya)+' − '+P(a)+' × '+PN(xa)+' = '+H(b))}.`,`D'où <b>${m('(AB) : '+eq(a,b))}</b>.`]})}
function gRPpp(){const a=F(nz(-5,5),pick([1,1,2,3])),mode=pick(['par','perp']);const ga=mode==='par'?a:F(-a.d,a.n);
  return mkQ({skill:"Parallèles et perpendiculaires",q:`(D) a pour coefficient directeur ${m(H(a))}. Quel est le coefficient directeur d'une droite ${mode==='par'?'parallèle':'perpendiculaire'} à (D) ?`,good:m(H(ga)),
    bad:[{h:m(H(mode==='par'?F(-a.d,a.n):a)),why:mode==='par'?"Parallèles : même coefficient directeur.":"Perpendiculaires : a × a' = −1."},{h:m(H(fneg(a))),why:mode==='par'?"Parallèles : même coefficient.":"a × a' = −1 : il faut l'inverse ET l'opposé."},{h:m(H(F(a.d,a.n))),why:"Revois la condition."}],hint:"Parallèles : a = a'. Perpendiculaires : a × a' = −1.",
    corr:[mode==='par'?`Deux droites parallèles ont le même coefficient directeur.`:`Deux droites perpendiculaires vérifient ${m("a × a' = −1")}, donc ${m("a' = −"+FR(1,'a'))}.`,`D'où <b>${m(H(ga))}</b>.`]})}
function coursREP3(){
  return bulle('Repérage dans le plan',`<p>Le repérage fait le lien entre la géométrie et le calcul : avec des <b>coordonnées</b>, on démontre parallélisme, orthogonalité et alignement par le calcul.</p>`)+
  lesson('1.',"Vecteurs et distances",retenir('Formules',`<p>${m(VEC('AB')+'(x<sub>B</sub> − x<sub>A</sub> ; y<sub>B</sub> − y<sub>A</sub>)')} ; ${m('AB = '+SQ('(x<sub>B</sub> − x<sub>A</sub>)<sup>2</sup> + (y<sub>B</sub> − y<sub>A</sub>)<sup>2</sup>'))}.</p><p>${m(VEC('u')+'(x ; y)')} et ${m(VEC('v')+"(x' ; y')")} sont colinéaires ⇔ ${m("xy' − x'y = 0")} ; orthogonaux ⇔ ${m("xx' + yy' = 0")}.</p>`))+
  lesson('2.',"Équations de droites",retenir('À retenir',`<p>Équation réduite : ${m('y = ax + b')} ; a est le coefficient directeur : ${m('a = '+FR('y<sub>B</sub> − y<sub>A</sub>','x<sub>B</sub> − x<sub>A</sub>'))}.</p><p>Droite parallèle à l'axe des ordonnées : ${m('x = k')}.</p>`))+
  lesson('3.',"Parallèles et perpendiculaires",retenir('Propriétés',`<p>(D) : y = ax + b et (D') : y = a'x + b'. (D) // (D') ⇔ ${m("a = a'")} ; (D) ⊥ (D') ⇔ ${m("a × a' = −1")}.</p>`))+
  `<button class="btn gold wide" data-act="tab" data-t="train">Je m'entraîne</button>`;
}
REG['3e-REP']={cours:coursREP3,geo:true,skills:[["vec","Coordonnées d'un vecteur",gRPvec],["col","Colinéarité",gRPcol],["orth","Orthogonalité",gRPorth],["eq","Équation de droite",gRPeq],["pp","Parallèles et perpendiculaires",gRPpp]],
  serie:()=>[gRPvec(),gRPvec(),gRPcol(),gRPcol(),gRPorth(),gRPorth(),gRPeq(),gRPeq(),gRPpp(),gRPpp()]};

/* ================= 3e · Applications affines ================= */
function gAFexp(){const a=nz(-4,4),b=nz(-8,8),x1=nz(-4,4);let x2;do{x2=nz(-4,4)}while(x2===x1);const y1=a*x1+b,y2=a*x2+b;
  return mkQ({skill:"Déterminer f",q:`f est une application affine telle que ${m('f('+N(x1)+') = '+N(y1))} et ${m('f('+N(x2)+') = '+N(y2))}. Détermine f(x).`,good:m('f(x) = '+lin(a,b)),
    bad:[{h:m('f(x) = '+lin(-a,b+2*a*x1)),why:"a = (f(x₂) − f(x₁)) ÷ (x₂ − x₁) : attention à l'ordre."},{h:m('f(x) = '+lin(a,-b)),why:"Vérifie b avec un des deux points."},{h:m('f(x) = '+lin(a,0)),why:"Une application affine a en général un terme constant b."}],hint:"a = (f(x₂) − f(x₁)) ÷ (x₂ − x₁), puis b.",
    corr:[`f est affine : ${m('f(x) = ax + b')}.`,`${m('a = '+FR('f('+N(x2)+') − f('+N(x1)+')',N(x2)+' − '+PN(x1))+' = '+FR(N(y2-y1),N(x2-x1))+' = '+N(a))}.`,`${m('f('+N(x1)+') = '+N(y1)+' ⇔ '+N(a)+' × '+PN(x1)+' + b = '+N(y1)+' ⇔ b = '+N(b))}.`,`D'où <b>${m('f(x) = '+lin(a,b))}</b>.`]})}
function gAFimg(){const a=nz(-4,4),b=nz(-8,8),x=nz(-6,6),mode=Math.random()<.5;
  if(mode)return mkQ({skill:"Image et antécédent",q:`${m('f(x) = '+lin(a,b))}. Calcule l'image de ${N(x)}.`,good:N(a*x+b),bad:[{h:N(a*x-b),why:"Erreur de signe sur b."},{h:N(a+x+b),why:"On multiplie a par x."},{h:N(-a*x+b),why:"Attention au signe de x."}],hint:"Remplace x.",corr:[`${m('f('+N(x)+') = '+N(a)+' × '+PN(x)+' + '+PN(b)+' = '+N(a*x+b))}.`,`D'où <b>${N(a*x+b)}</b>.`]});
  const y=a*x+b;return mkQ({skill:"Image et antécédent",q:`${m('f(x) = '+lin(a,b))}. Quel est l'antécédent de ${N(y)} ?`,good:N(x),bad:[{h:N(a*y+b),why:"Ça, c'est l'image de "+N(y)+"."},{h:N(Math.round((y+b)/a*100)/100),why:"Résous ax + b = "+N(y)+" : x = (y − b) ÷ a."},{h:N(-x),why:"Erreur de signe."}],hint:"Résous ax + b = "+N(y)+".",corr:[`${m(lin(a,b)+' = '+N(y)+' ⇔ '+lin(a,0)+' = '+N(y-b)+' ⇔ x = '+N(x))}.`,`D'où <b>${N(x)}</b>.`]})}
function gAFabs(){const a=nz(-3,3),b=nz(-6,6),x=nz(-5,5);const v=Math.abs(a*x+b);
  return mkQ({skill:"Affine par intervalles",q:`${m('f(x) = |'+lin(a,b)+'|')}. Calcule ${m('f('+N(x)+')')}.`,good:N(v),bad:[{h:N(a*x+b===v?-v:a*x+b),why:"Une valeur absolue est toujours positive."},{h:N(Math.abs(a*x)+Math.abs(b)===v?v+1:Math.abs(a*x)+Math.abs(b)),why:"|a + b| n'est pas |a| + |b|."},{h:N(v+Math.abs(a)),why:"Revois le calcul."}],hint:"Calcule d'abord ax + b, puis prends la valeur absolue.",
    corr:[`${m(N(a)+' × '+PN(x)+' + '+PN(b)+' = '+N(a*x+b))}.`,`${m('f('+N(x)+') = |'+N(a*x+b)+'| = '+N(v))}.`,`D'où <b>${N(v)}</b>.`]})}
function coursAFF(){
  return bulle('Applications affines',`<p>${m('f(x) = ax + b')} : c'est la droite que tu connais déjà (repérage), vue comme une <b>fonction</b>. Indispensable pour les problèmes de tarifs au BFEM.</p>`)+
  lesson('1.',"Définition",retenir('À retenir',`<p>Une application affine s'écrit ${m('f(x) = ax + b')}. Si b = 0, elle est linéaire. Sa représentation graphique est une droite de coefficient directeur a et d'ordonnée à l'origine b.</p>`))+
  lesson('2.',"Déterminer une application affine",methode('Méthode',`<p>Connaissant ${m('f(x<sub>1</sub>)')} et ${m('f(x<sub>2</sub>)')} : ${m('a = '+FR('f(x<sub>2</sub>) − f(x<sub>1</sub>)','x<sub>2</sub> − x<sub>1</sub>'))}, puis on trouve b en remplaçant.</p>`))+
  lesson('3.',"Affine par intervalles",retenir('Exemple',`<p>${m('f(x) = |x − 2|')} : si x ≥ 2, ${m('f(x) = x − 2')} ; si x ≤ 2, ${m('f(x) = −x + 2')}. Sa représentation est formée de deux demi-droites (un « V »).</p>`))+
  `<button class="btn gold wide" data-act="tab" data-t="train">Je m'entraîne</button>`;
}
REG['3e-AFF']={cours:coursAFF,skills:[["exp","Déterminer f",gAFexp],["img","Image et antécédent",gAFimg],["abs","Affine par intervalles",gAFabs]],
  serie:()=>[gAFexp(),gAFexp(),gAFexp(),gAFimg(),gAFimg(),gAFimg(),gAFabs(),gAFabs(),gAFabs(),gAFexp()]};

/* ================= 3e · Transformations du plan ================= */
function gTRApar(){const d=ri(2,8);return mkQ({skill:"Deux symétries orthogonales",q:`On applique la symétrie d'axe (D₁) puis celle d'axe (D₂), avec (D₁) // (D₂) distantes de ${d} cm. On obtient :`,good:`une translation de ${2*d} cm, perpendiculaire aux axes`,
  bad:[{h:`une translation de ${d} cm`,why:"La longueur de la translation est le double de la distance entre les axes."},{h:"une symétrie centrale",why:"C'est le cas d'axes perpendiculaires."},{h:"une rotation de 90°",why:"Les axes sont parallèles : on obtient une translation."}],hint:"Axes parallèles → translation de longueur double.",corr:[`Si (D₁) // (D₂), la composée des deux symétries orthogonales est une <b>translation</b> perpendiculaire aux axes, de longueur le double de la distance entre eux.`,`D'où <b>${2*d} cm</b>.`]})}
const TRA_Q=[["La composée de deux symétries orthogonales d'axes perpendiculaires en O est :","la symétrie centrale de centre O",["une translation","l'identité","une symétrie orthogonale"],"Axes perpendiculaires en O → symétrie de centre O (rotation de 180°)."],
  ["La composée de deux symétries orthogonales d'axes sécants en O formant un angle α est :","la rotation de centre O et d'angle 2α",["la rotation d'angle α","une translation","une symétrie centrale"],"Axes sécants en O → rotation de centre O et d'angle 2α."],
  ["La composée de la translation de vecteur u⃗ puis de celle de vecteur v⃗ est :","la translation de vecteur u + v",["la translation de vecteur u − v","une rotation","une symétrie"],"Deux translations successives donnent la translation de vecteur somme."]].map(([q,g,b,w])=>[q.replace(/u⃗/g,'u').replace(/v⃗/g,'v'),g,b,w]);
function coursTRA(){

const GUIDE={"5e": [{"id": "cover", "part": "Ouverture", "title": "Mathématiques", "eyebrow": "Année scolaire 2026 – 2027", "bg": "linear-gradient(135deg, #0B1D42 0%, #1E3F8A 100%)", "fg": "#F7F4EC", "html": "<div style=\"flex:1;display:flex;flex-direction:column;gap:8.4px\">\n<p style=\"align-self:start;background:#C9962B;color:#0B1D42;font-size:13.0px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;padding:3.0px 8.4px;border-radius:299.7px\">Année scolaire 2026 – 2027</p>\n<h1 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:40.2px;font-weight:900;line-height:1.05;color:#F7F4EC\">Mathématiques</h1>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:37.3px;font-weight:800;line-height:1.1;color:#E0B54A\">Classe de 5e</h2>\n<hr style=\"border-top:1.8px solid #C9962B\">\n<p style=\"font-size:18.0px;line-height:1.35;color:#F7F4EC\">Présentation du programme et de la progression annuelle</p>\n<p style=\"font-size:14.0px;line-height:1.4;color:#C9D6F0\">M. Thiam · Professeur de mathématiques · CEM Kennedy</p>\n<p style=\"align-self:start;font-size:14.0px;font-weight:700;color:#F7F4EC;border:1.0px solid #E0B54A;border-radius:299.7px;padding:3.0px 8.4px\">Rentrée : lundi 12 octobre 2026</p>\n</div>\n<div style=\"\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0 avec la photo de M. Thiam\" style=\"width:180.0px;height:180.0px;object-fit:cover;border-radius:50%;border:2.4px solid #C9962B;box-shadow:0px 7.2px 19.2px rgba(0,0,0,0.35)\">\n<img src=\"%%BADGE%%\" alt=\"Badge AFS Global STEM Educators\" style=\"width:54.0px;height:54.0px;object-fit:contain\">\n</div>", "note": ""}, {"id": "bienvenue", "part": "Ouverture", "title": "Une année pour bâtir des bases solides", "eyebrow": "Bienvenue en 5e", "bg": "#F7F4EC", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">Bienvenue en 5e</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Une année pour bâtir des bases solides</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;gap:16.8px;flex:1\">\n<div style=\"flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:9.6px\">\n<p style=\"font-size:16.0px;line-height:1.45;color:#33415C\">En 5e, on consolide les acquis de la 6e et on découvre de nouveaux outils : <b style=\"color:#0F2552\">puissances, PGCD et PPCM, fractions, nombres relatifs</b>. En géométrie, on apprend surtout à <b style=\"color:#0F2552\">justifier</b> ce que l'on affirme.</p>\n<div style=\"display:flex;flex-direction:row;align-items:center\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:45.0px;height:45.0px;object-fit:cover;border-radius:50%;border:1.2px solid #C9962B;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.25)\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px;background:#FFFDF8;border:1.0px solid #C9962B;border-radius:3.6px 12.0px 12.0px 12.0px;padding:7.2px 10.8px;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Caveat', cursive;font-size:19.0px;font-weight:700;line-height:1.1;color:#8A6210\">Le mot de Profdemaths 2.0</p>\n<p style=\"font-size:14.0px;line-height:1.35;color:#1B2A4A\">Les maths ne sont pas un don : c'est une méthode et de la régularité. Cette année, je vous accompagne pas à pas.</p>\n</div>\n</div>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:6.0px\">\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:8.4px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-left:2.4px solid #1E3F8A;border-radius:6.0px;padding:8.4px 9.6px\">\n<span class=\"gi\" style=\"color:#1E3F8A;font-size:14.5px\">⚡</span>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px\">\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:17.0px;font-weight:700;color:#0F2552\">Calculer avec aisance</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Puissances, fractions, nombres relatifs, PGCD et PPCM.</p>\n</div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:8.4px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-left:2.4px solid #1F7A5A;border-radius:6.0px;padding:8.4px 9.6px\">\n<span class=\"gi\" style=\"color:#1F7A5A;font-size:14.5px\">🛠️</span>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px\">\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:17.0px;font-weight:700;color:#0F2552\">Construire et démontrer</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Symétrie centrale, angles, parallélogramme, triangles, quadrilatères.</p>\n</div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:8.4px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-left:2.4px solid #C9962B;border-radius:6.0px;padding:8.4px 9.6px\">\n<span class=\"gi\" style=\"color:#8A6210;font-size:14.5px\">💡</span>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px\">\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:17.0px;font-weight:700;color:#0F2552\">Résoudre des problèmes</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Proportionnalité, pourcentages, échelles, vitesse moyenne, prisme droit.</p>\n</div>\n</div>\n</div>\n</div>", "note": ""}, {"id": "organisation", "part": "Ouverture", "title": "6 heures par semaine, deux semestres", "eyebrow": "Organisation de l'année", "bg": "#EEF2FA", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">Organisation de l'année</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">6 heures par semaine, deux semestres</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;gap:8.4px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#0F2552;border-radius:7.2px;padding:10.8px 9.6px\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:40.2px;font-weight:900;line-height:1;color:#E0B54A\">6 h</p>\n<p style=\"font-size:14.0px;line-height:1.35;color:#F7F4EC\">de mathématiques chaque semaine</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#FFFDF8;border:1.0px solid #D5DDEE;border-radius:7.2px;padding:10.8px 9.6px\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:40.2px;font-weight:900;line-height:1;color:#1E3F8A\">2</p>\n<p style=\"font-size:14.0px;line-height:1.35;color:#33415C\">semestres, chacun clôturé par une <b>composition</b></p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#FFFDF8;border:1.0px solid #D5DDEE;border-radius:7.2px;padding:10.8px 9.6px\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:40.2px;font-weight:900;line-height:1;color:#1F7A5A\">4</p>\n<p style=\"font-size:14.0px;line-height:1.35;color:#33415C\">évaluations standardisées : 2 de l'<b>établissement</b>, 2 de l'<b>IEF</b></p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#FFFDF8;border:1.0px solid #D5DDEE;border-radius:7.2px;padding:10.8px 9.6px\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:40.2px;font-weight:900;line-height:1;color:#8A6210\">+</p>\n<p style=\"font-size:14.0px;line-height:1.35;color:#33415C\">des devoirs et des interrogations du professeur</p>\n</div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:45.0px;height:45.0px;object-fit:cover;border-radius:50%;border:1.2px solid #C9962B;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.25)\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px;background:#FFFDF8;border:1.0px solid #C9962B;border-radius:3.6px 12.0px 12.0px 12.0px;padding:7.2px 10.8px;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Caveat', cursive;font-size:19.0px;font-weight:700;line-height:1.1;color:#8A6210\">Remarque importante</p>\n<p style=\"font-size:14.0px;line-height:1.35;color:#1B2A4A\">Les évaluations portent sur les <b>compétences exigibles</b> : chaque leçon vous dit précisément ce que vous devez savoir faire. Après chaque évaluation : correction et remédiation.</p>\n</div>\n</div>", "note": ""}, {"id": "programme", "part": "Le programme de 5e et la progression harmonisée", "title": "12 leçons, deux grandes familles", "eyebrow": "Le programme en un coup d'œil", "bg": "#F7F4EC", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">Le programme en un coup d'œil</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">12 leçons, deux grandes familles</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;gap:12.0px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4.2px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-top:3.0px solid #1E3F8A;border-radius:7.2px;padding:9.6px 10.8px\">\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:18.0px;font-weight:800;color:#1E3F8A\">Activités numériques</h3>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:6.0px\"><p style=\"width:26.0px;height:26.0px;border-radius:50%;background:#1E3F8A;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;line-height:2\">1</p><p style=\"flex:1;font-size:15.0px;color:#1B2A4A\">Puissances dans D</p></div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:6.0px\"><p style=\"width:26.0px;height:26.0px;border-radius:50%;background:#1E3F8A;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;line-height:2\">2</p><p style=\"flex:1;font-size:15.0px;color:#1B2A4A\">Multiples et diviseurs (PGCD, PPCM)</p></div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:6.0px\"><p style=\"width:26.0px;height:26.0px;border-radius:50%;background:#1E3F8A;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;line-height:2\">3</p><p style=\"flex:1;font-size:15.0px;color:#1B2A4A\">Fractions</p></div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:6.0px\"><p style=\"width:26.0px;height:26.0px;border-radius:50%;background:#1E3F8A;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;line-height:2\">4</p><p style=\"flex:1;font-size:15.0px;color:#1B2A4A\">Les décimaux relatifs</p></div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:6.0px\"><p style=\"width:26.0px;height:26.0px;border-radius:50%;background:#1E3F8A;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;line-height:2\">5</p><p style=\"flex:1;font-size:15.0px;color:#1B2A4A\">Proportionnalité</p></div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:6.0px\"><p style=\"width:26.0px;height:26.0px;border-radius:50%;background:#1E3F8A;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;line-height:2\">6</p><p style=\"flex:1;font-size:15.0px;color:#1B2A4A\">Représentation graphique d'un tableau de correspondance</p></div>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4.2px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-top:3.0px solid #1F7A5A;border-radius:7.2px;padding:9.6px 10.8px\">\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:18.0px;font-weight:800;color:#1F7A5A\">Activités géométriques</h3>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:6.0px\"><p style=\"width:26.0px;height:26.0px;border-radius:50%;background:#1F7A5A;color:#F7F4EC;font-size:13.0px;font-weight:800;text-alig <tr style=\"background:#FFFDF8\"><td>Mai S1 – S2</td><td>Représentation graphique d'un tableau de correspondance</td><td style=\"color:#1E3F8A\"><b>Numérique</b></td></tr>\n<tr style=\"background:#F3F6FC\"><td>Mai S3 – S4</td><td>Géométrie dans l'espace : le prisme droit</td><td style=\"color:#1F7A5A\"><b>Géométrie</b></td></tr>\n<tr style=\"background:#FFFDF8\"><td>Juin S1 – S2</td><td>Révisions</td><td style=\"color:#5B6680\"><b>Bilan</b></td></tr>\n<tr style=\"background:#F6E7C1\"><td><b>Juin S3</b></td><td><b>Composition du 2nd semestre</b></td><td style=\"color:#8A6210\"><b>Évaluation</b></td></tr>\n</table>", "note": "Deuxième semestre. Les vacances de Pâques occupent les deux premières semaines d'avril. Juin commence par deux semaines de révision avant la composition."}, {"id": "calendrier", "part": "Le programme de 5e et la progression harmonisée", "title": "Six rendez-vous à préparer", "eyebrow": "Le calendrier des évaluations", "bg": "#F7F4EC", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">Le calendrier des évaluations</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Six rendez-vous à préparer</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:stretch;gap:7.2px\">\n<div style=\"display:flex;flex-direction:column;justify-content:center;background:#0F2552;border-radius:6.0px;padding:7.2px\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;line-height:1.2;color:#E0B54A\">Semestre 1</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:6.0px;padding:7.2px 8.4px\">\n<p style=\"align-self:start;background:#EEF2FA;color:#1E3F8A;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">Novembre S4</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:700;color:#0F2552\">Évaluation 1</h3>\n<p style=\"font-size:12.5px;color:#5B6680\">Niveau établissement</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:6.0px;padding:7.2px 8.4px\">\n<p style=\"align-self:start;background:#EEF2FA;color:#1E3F8A;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">Décembre S3</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:700;color:#0F2552\">Évaluation 2</h3>\n<p style=\"font-size:12.5px;color:#5B6680\">Niveau IEF</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#F6E7C1;border:1.0px solid #E0C88A;border-radius:6.0px;padding:7.2px 8.4px\">\n<p style=\"align-self:start;background:#0F2552;color:#F7F4EC;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">Février S3</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:700;color:#0F2552\">Composition</h3>\n<p style=\"font-size:12.5px;color:#5B4A1E\">Fin du 1er semestre</p>\n</div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:stretch;gap:7.2px\">\n<div style=\"display:flex;flex-direction:column;justify-content:center;background:#1F7A5A;border-radius:6.0px;padding:7.2px\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;line-height:1.2;color:#F7F4EC\">Semestre 2</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:6.0px;padding:7.2px 8.4px\">\n<p style=\"align-self:start;background:#E6F2EC;color:#1F7A5A;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">Mars S4</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:700;color:#0F2552\">Évaluation 1</h3>\n<p style=\"font-size:12.5px;color:#5B6680\">Niveau établissement</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:6.0px;padding:7.2px 8.4px\">\n<p style=\"align-self:start;background:#E6F2EC;color:#1F7A5A;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">Mai S1</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:700;color:#0F2552\">Évaluation 2</h3>\n<p style=\"font-size:12.5px;color:#5B6680\">Niveau IEF</p>\n</div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:3.0px;background:#F6E7C1;border:1.0px solid #E0C88A;border-radius:6.0px;padding:7.2px 8.4px\">\n<p style=\"align-self:start;background:#0F2552;color:#F7F4EC;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">Juin S3</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:700;color:#0F2552\">Composition</h3>\n<p style=\"font-size:12.5px;color:#5B4A1E\">Fin du 2nd semestre</p>\n</div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:6.0px;background:#EEF2FA;border-radius:4.8px;padding:5.4px 8.4px\">\n<span class=\"gi\" style=\"color:#1E3F8A;font-size:12.5px\">⏰</span>\n<p style=\"flex:1;font-size:13.0px;color:#1B2A4A\"><b>Vacances :</b> Noël (décembre S4) et Pâques (avril S1 – S2). <b>Après chaque évaluation :</b> correction et remédiation.</p>\n</div>", "note": "Les dates suivent la progression harmonisée ; elles peuvent être ajustées par l'établissement ou l'IEF. Note ces rendez-vous dans ton agenda dès aujourd'hui."}, {"id": "methode", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "La méthode Profdemaths 2.0", "eyebrow": "Apprendre à apprendre", "bg": "linear-gradient(135deg, #0B1D42 0%, #1E3F8A 100%)", "fg": "#F7F4EC", "html": "<div style=\"display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:19.2px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6.0px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#E0B54A\">Apprendre à apprendre</p>\n<h1 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:37.3px;font-weight:900;line-height:1.1;color:#F7F4EC\">La méthode<br>Profdemaths 2.0</h1>\n<p style=\"font-family:'Caveat', cursive;font-size:27.2px;font-weight:700;line-height:1.1;color:#E0B54A\">pour apprendre les maths… et réussir !</p>\n</div>\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:126.0px;height:126.0px;object-fit:cover;border-radius:50%;border:2.4px solid #C9962B;box-shadow:0px 7.2px 19.2px rgba(0,0,0,0.35)\">\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:4.8px\">\n<p style=\"background:#F7F4EC;color:#0F2552;font-size:16.0px;font-weight:800;padding:4.2px 9.0px;border-radius:299.7px\">Comprendre</p>\n<span class=\"ga\" style=\"color:#E0B54A\">➜</span>\n<p style=\"background:#F7F4EC;color:#0F2552;font-size:16.0px;font-weight:800;padding:4.2px 9.0px;border-radius:299.7px\">Retenir</p>\n<span class=\"ga\" style=\"color:#E0B54A\">➜</span>\n<p style=\"background:#F7F4EC;color:#0F2552;font-size:16.0px;font-weight:800;padding:4.2px 9.0px;border-radius:299.7px\">S'entraîner</p>\n<span class=\"ga\" style=\"color:#E0B54A\">➜</span>\n<p style=\"background:#F7F4EC;color:#0F2552;font-size:16.0px;font-weight:800;padding:4.2px 9.0px;border-radius:299.7px\">Rédiger</p>\n<span class=\"ga\" style=\"color:#E0B54A\">➜</span>\n<p style=\"background:#E0B54A;color:#0B1D42;font-size:16.0px;font-weight:800;padding:4.2px 9.0px;border-radius:299.7px\">Corriger</p>\n</div>", "note": ""}, {"id": "reflexes", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "Six réflexes pour apprendre", "eyebrow": "La méthode Profdemaths 2.0", "bg": "#F7F4EC", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">La méthode Profdemaths 2.0</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Six réflexes pour apprendre</h2>\n</div>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8.4px\">\n<div style=\"display:flex;flex-direction:column;gap:2.4px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:7.2px;padding:8.4px 9.6px;box-shadow:0px 1.8px 5.4px rgba(15,37,82,0.06)\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;line-height:1;color:#C9962B\">01</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;color:#0F2552\">Écouter et comprendre</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">En classe, je suis actif : je note, je participe, je pose mes questions tout de suite.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:2.4px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:7.2px;padding:8.4px 9.6px;box-shadow:0px 1.8px 5.4px rgba(15,37,82,0.06)\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;line-height:1;color:#C9962B\">02</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;color:#0F2552\">Revoir le jour même</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Le soir, je relis le cours et je refais les exemples sans regarder la correction.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:2.4px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:7.2px;padding:8.4px 9.6px;box-shadow:0px 1.8px 5.4px rgba(15,37,82,0.06)\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;line-height:1;color:#C9962B\">03</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;color:#0F2552\">Retenir l'essentiel</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Définitions, propriétés, formules : je les apprends par cœur sur une fiche.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:2.4px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:7.2px;padding:8.4px 9.6px;box-shadow:0px 1.8px 5.4px rgba(15,37,82,0.06)\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;line-height:1;color:#C9962B\">04</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;color:#0F2552\">Pratiquer chaque jour</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Un peu chaque jour vaut mieux que tout la veille : exercices du cours, puis nouveaux.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:2.4px;background:#0F2552;border-radius:7.2px;padding:8.4px 9.6px;box-shadow:0px 1.8px 5.4px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;line-height:1;color:#E0B54A\">05</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;color:#F7F4EC\">Rédiger avec logique</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#C9D6F0\">Chaque étape est justifiée : on sait que… or… donc… d'où…</p>\n</div>\n<div style=\"display:flex;flex-direction:column;gap:2.4px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:7.2px;padding:8.4px 9.6px;box-shadow:0px 1.8px 5.4px rgba(15,37,82,0.06)\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;line-height:1;color:#C9962B\">06</p>\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;color:#0F2552\">Corriger ses erreurs</h3>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Je tiens un carnet d'erreurs et je refais les exercices ratés jusqu'à les réussir.</p>\n</div>\n</div>", "note": ""}, {"id": "competences", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "Trois niveaux pour maîtriser une leçon", "eyebrow": "Ce que l'on attend de toi", "bg": "#EEF2FA", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">Ce que l'on attend de toi</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Trois niveaux pour maîtriser une leçon</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:stretch;gap:8.4px\"><div style=\"flex:1;display:flex;flex-direction:column;gap:3.6px;background:#FFFDF8;border:1.0px solid #D5DDEE;border-radius:7.2px;padding:9.0px 9.6px;margin-top:0px\"><p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:25.8px;font-weight:900;line-height:1;color:#E0B54A\">1</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:18.0px;font-weight:800;color:#0F2552\">Restituer</h3><p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Je sais énoncer la définition ou la propriété, sans me tromper.</p><p style=\"font-size:13.0px;line-height:1.35;color:#1B2A4A;background:#EEF2FA;border-radius:4.2px;padding:4.2px 5.4px\"><b>Ex. :</b> aⁿ × aᵖ = aⁿ⁺ᵖ</p></div><div style=\"flex:1;display:flex;flex-direction:column;gap:3.6px;background:#FFFDF8;border:1.0px solid #D5DDEE;border-radius:7.2px;padding:9.0px 9.6px;margin-top:0px\"><p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:25.8px;font-weight:900;line-height:1;color:#E0B54A\">2</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:18.0px;font-weight:800;color:#0F2552\">Utiliser</h3><p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Je l'applique dans un exercice type, comme en classe.</p><p style=\"font-size:13.0px;line-height:1.35;color:#1B2A4A;background:#EEF2FA;border-radius:4.2px;padding:4.2px 5.4px\"><b>Ex. :</b> Écrire 3² × 3⁵ sous la forme d'une seule puissance.</p></div><div style=\"flex:1;display:flex;flex-direction:column;gap:3.6px;background:#0F2552;border-radius:7.2px;padding:9.0px 9.6px;margin-top:0px\"><p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:25.8px;font-weight:900;line-height:1;color:#E0B54A\">3</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:18.0px;font-weight:800;color:#F7F4EC\">Résoudre</h3><p style=\"font-size:13.0px;line-height:1.35;color:#C9D6F0\">Je la mobilise seul(e) dans un problème nouveau.</p><p style=\"font-size:13.0px;line-height:1.35;color:#F7F4EC;background:#1E3F8A;border-radius:4.2px;padding:4.2px 5.4px\"><b>Ex. :</b> Calculer astucieusement 2⁵ × 5⁵ sans poser la multiplication.</p></div></div>\n<div style=\"display:flex;flex-direction:row;align-items:center\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:44.0px;height:44.0px;object-fit:cover;border-radius:50%;border:1.2px solid #C9962B;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.25)\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px;background:#FFFDF8;border:1.0px solid #C9962B;border-radius:3.6px 12.0px 12.0px 12.0px;padding:6.6px 9.6px;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Caveat', cursive;font-size:18.0px;font-weight:700;line-height:1.1;color:#8A6210\">Le conseil du prof</p>\n<p style=\"font-size:13.0px;line-height:1.35;color:#1B2A4A\">Les évaluations testent les trois niveaux. Je ne m'arrête jamais à « je connais la règle » : je vérifie que je sais l'utiliser.</p>\n</div>\n</div>", "note": ""}, {"id": "cycle", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "Une leçon se travaille en trois temps", "eyebrow": "La méthode Profdemaths 2.0", "bg": "#F7F4EC", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">La méthode Profdemaths 2.0</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Une leçon se travaille en trois temps</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;gap:8.4px\"><div style=\"flex:1;display:flex;flex-direction:column;gap:4.8px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-top:3.0px solid #1E3F8A;border-radius:7.2px;padding:9.0px 10.2px\"><p style=\"align-self:start;background:#1E3F8A;color:#F7F4EC;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">La veille · 10 min</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:18.0px;font-weight:800;color:#0F2552\">Avant</h3><div style=\"display:flex;flex-direction:row;gap:4.2px;align-items:start\"><p style=\"width:7.0px;height:7.0px;border-radius:50%;background:#1E3F8A;margin-top:3.6px\"></p><p style=\"flex:1;font-size:13.5px;line-height:1.35;color:#1B2A4A\">Je relis la leçon précédente.</p></div><div style=\"display:flex;flex-direction:row;gap:4.2px;align-items:start\"><p style=\"width:7.0px;height:7.0px;border-radius:50%;background:#1E3F8A;margin-top:3.6px\"></p><p style=\"flex:1;font-size:13.5px;line-height:1.35;color:#1B2A4A\">Je prépare cahier, règle, équerre, compas et rapporteur.</p></div></div><div style=\"flex:1;display:flex;flex-direction:column;gap:4.8px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-top:3.0px solid #1F7A5A;border-radius:7.2px;padding:9.0px 10.2px\"><p style=\"align-self:start;background:#1F7A5A;color:#F7F4EC;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">En classe</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:18.0px;font-weight:800;color:#0F2552\">Pendant</h3><div style=\"display:flex;flex-direction:row;gap:4.2px;align-items:start\"><p style=\"width:7.0px;height:7.0px;border-radius:50%;background:#1F7A5A;margin-top:3.6px\"></p><p style=\"flex:1;font-size:13.5px;line-height:1.35;color:#1B2A4A\">Je cherche les activités, même si je me trompe.</p></div><div style=\"display:flex;flex-direction:row;gap:4.2px;align-items:start\"><p style=\"width:7.0px;height:7.0px;border-radius:50%;background:#1F7A5A;margin-top:3.6px\"></p><p style=\"flex:1;font-size:13.5px;line-height:1.35;color:#1B2A4A\">Je note les exemples rédigés.</p></div><div style=\"display:flex;flex-direction:row;gap:4.2px;align-items:start\"><p style=\"width:7.0px;height:7.0px;border-radius:50%;background:#1F7A5A;margin-top:3.6px\"></p><p style=\"flex:1;font-size:13.5px;line-height:1.35;color:#1B2A4A\">Je pose ma question tout de suite.</p></div></div><div style=\"flex:1;display:flex;flex-direction:column;gap:4.8px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-top:3.0px solid #C9962B;border-radius:7.2px;padding:9.0px 10.2px\"><p style=\"align-self:start;background:#C9962B;color:#F7F4EC;font-size:12.5px;font-weight:800;padding:1.8px 5.4px;border-radius:299.7px\">Le soir même · 30 min</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:18.0px;font-weight:800;color:#0F2552\">Après</h3><div style=\"display:flex;flex-direction:row;gap:4.2px;align-items:start\"><p style=\"width:7.0px;height:7.0px;border-radius:50%;background:#C9962B;margin-top:3.6px\"></p><p style=\"flex:1;font-size:13.5px;line-height:1.35;color:#1B2A4A\">Je relis et je surligne l'essentiel.</p></div><div style=\"display:flex;flex-direction:row;gap:4.2px;align-items:start\"><p style=\"width:7.0px;height:7.0px;border-radius:50%;background:#C9962B;margin-top:3.6px\"></p><p style=\"flex:1;font-size:13.5px;line-height:1.35;color:#1B2A4A\">Je refais un exemple cahier fermé.</p></div><div style=\"display:flex;flex-direction:row;gap:4.2px;align-items:start\"><p style=\"width:7.0px;height:7.0px;border-radius:50%;background:#C9962B;margin-top:3.6px\"></p><p style=\"flex:1;font-size:13.5px;line-height:1.35;color:#1B2A4A\">Je fais 2 ou 3 exercices, ou l'appli.</p></div></div></div>\n<div style=\"display:flex;flex-direction:row;align-items:center\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:44.0px;height:44.0px;object-fit:cover;border-radius:50%;border:1.2px solid #C9962B;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.25)\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px;background:#FFFDF8;border:1.0px solid #C9962B;border-radius:3.6px 12.0px 12.0px 12.0px;padding:6.6px 9.6px;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Caveat', cursive;font-size:18.0px;font-weight:700;line-height:1.1;color:#8A6210\">Le conseil du prof</p>\n<p style=\"font-size:13.0px;line-height:1.35;color:#1B2A4A\">Le travail du soir même est le plus rentable : 30 minutes le jour J valent mieux que 3 heures la veille du devoir.</p>\n</div>\n</div>", "note": ""}, {"id": "memoire", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "Relire ne suffit pas : je me teste !", "eyebrow": "Retenir pour longtemps", "bg": "linear-gradient(135deg, #0B1D42 0%, #1E3F8A 100%)", "fg": "#F7F4EC", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\"><p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#E0B54A\">Retenir pour longtemps</p><h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#F7F4EC\">Relire ne suffit pas : je me teste !</h2></div>\n<div style=\"display:flex;flex-direction:row;gap:7.2px\"><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3.0px\"><p style=\"width:60.0px;height:60.0px;border-radius:50%;background:#E0B54A;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:17.0px;font-weight:900;text-align:center;line-height:3.5\">J0</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#F7F4EC;text-align:center\">Le soir même</h3><p style=\"font-size:12.5px;line-height:1.35;color:#C9D6F0;text-align:center\">Je refais les exemples cahier fermé.</p></div><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3.0px\"><p style=\"width:60.0px;height:60.0px;border-radius:50%;background:#F7F4EC;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:17.0px;font-weight:900;text-align:center;line-height:3.5\">J+1</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#F7F4EC;text-align:center\">Le lendemain</h3><p style=\"font-size:12.5px;line-height:1.35;color:#C9D6F0;text-align:center\">Je réécris de mémoire les propriétés.</p></div><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3.0px\"><p style=\"width:60.0px;height:60.0px;border-radius:50%;background:#F7F4EC;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:17.0px;font-weight:900;text-align:center;line-height:3.5\">J+7</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#F7F4EC;text-align:center\">Une semaine après</h3><p style=\"font-size:12.5px;line-height:1.35;color:#C9D6F0;text-align:center\">Je refais un exercice sans aide.</p></div><div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3.0px\"><p style=\"width:60.0px;height:60.0px;border-radius:50%;background:#F7F4EC;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:17.0px;font-weight:900;text-align:center;line-height:3.5\">J+30</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#F7F4EC;text-align:center\">Un mois après</h3><p style=\"font-size:12.5px;line-height:1.35;color:#C9D6F0;text-align:center\">Je me teste avant l'évaluation du mois.</p></div></div>\n<div style=\"display:flex;flex-direction:row;gap:7.2px\"><div style=\"flex:1;display:flex;flex-direction:row;align-items:center;gap:5.4px;background:rgba(255,255,255,0.08);border:1.0px solid #E0B54A;border-radius:6.0px;padding:6.0px 7.8px\"><p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;color:#E0B54A\">1</p><p style=\"flex:1;font-size:13.0px;line-height:1.3;color:#F7F4EC\">Je cache le cours.</p></div><div style=\"flex:1;display:flex;flex-direction:row;align-items:center;gap:5.4px;background:rgba(255,255,255,0.08);border:1.0px solid #E0B54A;border-radius:6.0px;padding:6.0px 7.8px\"><p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;color:#E0B54A\">2</p><p style=\"flex:1;font-size:13.0px;line-height:1.3;color:#F7F4EC\">J'écris de mémoire.</p></div><div style=\"flex:1;display:flex;flex-direction:row;align-items:center;gap:5.4px;background:rgba(255,255,255,0.08);border:1.0px solid #E0B54A;border-radius:6.0px;padding:6.0px 7.8px\"><p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:21.4px;font-weight:900;color:#E0B54A\">3</p><p style=\"flex:1;font-size:13.0px;line-height:1.3;color:#F7F4EC\">Je compare et je corrige en rouge.</p></div></div>", "note": ""}, {"id": "exercice", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "Face à un exercice : quatre étapes", "eyebrow": "La méthode Profdemaths 2.0", "bg": "#F7F4EC", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">La méthode Profdemaths 2.0</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Face à un exercice : quatre étapes</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:stretch;gap:4.2px\"><div style=\"flex:1;display:flex;flex-direction:column;gap:3.6px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:7.2px;padding:8.4px 8.4px\"><p style=\"width:32.0px;height:32.0px;border-radius:50%;background:#C9962B;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:16.0px;font-weight:900;text-align:center;line-height:2\">1</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:16.0px;font-weight:800;color:#0F2552\">Lire et coder</h3><p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Je lis deux fois, je souligne les données, je fais et je code la figure.</p></div><span class=\"ga\" style=\"color:#C9962B\">➜</span><div style=\"flex:1;display:flex;flex-direction:column;gap:3.6px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:7.2px;padding:8.4px 8.4px\"><p style=\"width:32.0px;height:32.0px;border-radius:50%;background:#C9962B;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:16.0px;font-weight:900;text-align:center;line-height:2\">2</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:16.0px;font-weight:800;color:#0F2552\">Je sais / Je cherche</h3><p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Je fais deux colonnes : ce que l'énoncé me donne, ce qu'on me demande.</p></div><span class=\"ga\" style=\"color:#C9962B\">➜</span><div style=\"flex:1;display:flex;flex-direction:column;gap:3.6px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:7.2px;padding:8.4px 8.4px\"><p style=\"width:32.0px;height:32.0px;border-radius:50%;background:#C9962B;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:16.0px;font-weight:900;text-align:center;line-height:2\">3</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:16.0px;font-weight:800;color:#0F2552\">Choisir l'outil</h3><p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\">Quelle définition ou propriété du cours relie les deux colonnes ?</p></div><span class=\"ga\" style=\"color:#C9962B\">➜</span><div style=\"flex:1;display:flex;flex-direction:column;gap:3.6px;background:#0F2552;border-radius:7.2px;padding:8.4px 8.4px\"><p style=\"width:32.0px;height:32.0px;border-radius:50%;background:#C9962B;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:16.0px;font-weight:900;text-align:center;line-height:2\">4</p><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:16.0px;font-weight:800;color:#F7F4EC\">Rédiger et vérifier</h3><p style=\"font-size:13.0px;line-height:1.35;color:#C9D6F0\">On sait que… or… donc… d'où… Puis je relis : unité, signe, cohérence.</p></div></div>\n<div style=\"display:flex;flex-direction:row;align-items:center\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:44.0px;height:44.0px;object-fit:cover;border-radius:50%;border:1.2px solid #C9962B;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.25)\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px;background:#FFFDF8;border:1.0px solid #C9962B;border-radius:3.6px 12.0px 12.0px 12.0px;padding:6.6px 9.6px;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Caveat', cursive;font-size:18.0px;font-weight:700;line-height:1.1;color:#8A6210\">Le conseil du prof</p>\n<p style=\"font-size:13.0px;line-height:1.35;color:#1B2A4A\">En géométrie, je commence toujours par une figure à main levée, bien codée : la moitié de la solution est souvent dessus.</p>\n</div>\n</div>", "note": ""}, {"id": "redaction", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "Une démonstration est une chaîne", "eyebrow": "Réflexe 05 · Rédiger avec logique", "bg": "#EEF2FA", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">Réflexe 05 · Rédiger avec logique</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Une démonstration est une chaîne</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;gap:12.0px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6.0px;background:#FFFDF8;border:1.0px solid #D5DDEE;border-radius:7.2px;padding:9.6px 10.8px\">\n<p style=\"align-self:start;background:#1F7A5A;color:#F7F4EC;font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;padding:1.8px 5.4px;border-radius:299.7px\">Exemple · Les angles</p>\n<p style=\"font-size:13.0px;line-height:1.35;color:#5B6680\"><i>(d) et (d') sont parallèles, coupées par la sécante (Δ). L'angle â mesure 50° et ê est son alterne-interne. Calculer ê.</i></p>\n<div style=\"display:flex;flex-direction:row;align-items:start;gap:6.0px\"><p style=\"background:#0F2552;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;padding:1.8px 0px;border-radius:3.6px\">On sait que</p><p style=\"flex:1;font-size:14.0px;line-height:1.35;color:#1B2A4A\">(d) // (d'), coupées par (Δ), et â = 50°.</p></div>\n<div style=\"display:flex;flex-direction:row;align-items:start;gap:6.0px\"><p style=\"background:#0F2552;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;padding:1.8px 0px;border-radius:3.6px\">Or</p><p style=\"flex:1;font-size:14.0px;line-height:1.35;color:#1B2A4A\">deux droites parallèles coupées par une sécante forment des angles alternes-internes de même mesure.</p></div>\n<div style=\"display:flex;flex-direction:row;align-items:start;gap:6.0px\"><p style=\"background:#0F2552;color:#F7F4EC;font-size:13.0px;font-weight:800;text-align:center;padding:1.8px 0px;border-radius:3.6px\">Donc</p><p style=\"flex:1;font-size:14.0px;line-height:1.35;color:#1B2A4A\">â et ê étant alternes-internes : ê = â.</p></div>\n<div style=\"display:flex;flex-direction:row;align-items:start;gap:6.0px\"><p style=\"background:#C9962B;color:#0B1D42;font-size:13.0px;font-weight:800;text-align:center;padding:1.8px 0px;border-radius:3.6px\">D'où</p><p style=\"flex:1;font-size:14.0px;line-height:1.35;color:#1B2A4A\"><b>ê = 50°.</b></p></div>\n</div>\n<div style=\"display:flex;flex-direction:column;justify-content:space-between;gap:8.4px\">\n<div style=\"display:flex;flex-direction:column;gap:4.2px;background:#FFFDF8;border:1.0px solid #D5DDEE;border-radius:7.2px;padding:8.4px 9.6px\">\n<h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:15.0px;font-weight:800;color:#0F2552\">Les mots qui relient</h3>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:3.6px\">\n<p style=\"background:#EEF2FA;color:#1E3F8A;font-size:13.0px;font-weight:700;padding:1.8px 5.4px;border-radius:299.7px\">on sait que</p>\n<p style=\"background:#EEF2FA;color:#1E3F8A;font-size:13.0px;font-weight:700;padding:1.8px 5.4px;border-radius:299.7px\">or</p>\n<p style=\"background:#EEF2FA;color:#1E3F8A;font-size:13.0px;font-weight:700;padding:1.8px 5.4px;border-radius:299.7px\">mais</p>\n<p style=\"background:#EEF2FA;color:#1E3F8A;font-size:13.0px;font-weight:700;padding:1.8px 5.4px;border-radius:299.7px\">alors</p>\n<p style=\"background:#EEF2FA;color:#1E3F8A;font-size:13.0px;font-weight:700;padding:1.8px 5.4px;border-radius:299.7px\">donc</p>\n<p style=\"background:#EEF2FA;color:#1E3F8A;font-size:13.0px;font-weight:700;padding:1.8px 5.4px;border-radius:299.7px\">d'où</p>\n<p style=\"background:#EEF2FA;color:#1E3F8A;font-size:13.0px;font-weight:700;padding:1.8px 5.4px;border-radius:299.7px\">⇒ implique</p>\n<p style=\"background:#EEF2FA;color:#1E3F8A;font-size:13.0px;font-weight:700;padding:1.8px 5.4px;border-radius:299.7px\">⇔ équivaut à</p>\n</div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:44.0px;height:44.0px;object-fit:cover;border-radius:50%;border:1.2px solid #C9962B;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.25)\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px;background:#FFFDF8;border:1.0px solid #C9962B;border-radius:3.6px 12.0px 12.0px 12.0px;padding:6.6px 8.4px;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Caveat', cursive;font-size:18.0px;font-weight:700;line-height:1.1;color:#8A6210\">Conseil du prof</p>\n<p style=\"font-size:13.0px;line-height:1.35;color:#1B2A4A\">Je nomme toujours la propriété utilisée : c'est elle qui transforme un calcul en démonstration.</p>\n</div>\n</div>\n</div>\n</div>", "note": ""}, {"id": "erreurs", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "Mon carnet d'erreurs, mon meilleur professeur", "eyebrow": "La méthode Profdemaths 2.0", "bg": "#EEF2FA", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">La méthode Profdemaths 2.0</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Mon carnet d'erreurs, mon meilleur professeur</h2>\n</div>\n<table style=\"width:100%;font-size:13.0px;color:#1B2A4A;border:1.0px solid #CFD8EA;border-radius:4.8px\"><tr style=\"background:#0F2552\"><th style=\"width:24%;color:#F7F4EC;text-align:left\">Mon erreur</th><th style=\"width:28%;color:#F7F4EC;text-align:left\">Pourquoi c'est faux</th><th style=\"width:30%;color:#F7F4EC;text-align:left\">La bonne règle</th><th style=\"width:18%;color:#F7F4EC;text-align:left\">Je refais</th></tr><tr style=\"background:#FFFDF8\"><td style=\"color:#B4442F\"><b>5³ = 15</b></td><td>5³ n'est pas 5 × 3</td><td style=\"color:#1F7A5A\"><b>5³ = 5 × 5 × 5 = 125</b></td><td style=\"color:#5B6680\">J+1 ☐ &nbsp; J+7 ☐</td></tr><tr style=\"background:#F3F6FC\"><td style=\"color:#B4442F\"><b>2 + 3 × 4 = 20</b></td><td>la multiplication est prioritaire</td><td style=\"color:#1F7A5A\"><b>2 + 3 × 4 = 2 + 12 = 14</b></td><td style=\"color:#5B6680\">J+1 ☐ &nbsp; J+7 ☐</td></tr><tr style=\"background:#FFFDF8\"><td style=\"color:#B4442F\"><b>87 = 6 × 13 + 9</b></td><td>le reste doit être plus petit que 6</td><td style=\"color:#1F7A5A\"><b>87 = 6 × 14 + 3</b></td><td style=\"color:#5B6680\">J+1 ☐ &nbsp; J+7 ☐</td></tr></table>\n<div style=\"display:flex;flex-direction:row;align-items:center\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:44.0px;height:44.0px;object-fit:cover;border-radius:50%;border:1.2px solid #C9962B;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.25)\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px;background:#FFFDF8;border:1.0px solid #C9962B;border-radius:3.6px 12.0px 12.0px 12.0px;padding:6.6px 9.6px;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Caveat', cursive;font-size:18.0px;font-weight:700;line-height:1.1;color:#8A6210\">Le conseil du prof</p>\n<p style=\"font-size:13.0px;line-height:1.35;color:#1B2A4A\">Une erreur notée, comprise et refaite est une erreur que l'on ne refait plus. Après chaque devoir, j'ajoute mes erreurs au carnet.</p>\n</div>\n</div>", "note": ""}, {"id": "appli", "part": "La méthode Profdemaths 2.0 pour apprendre les maths", "title": "Ton application Profdemaths 2.0", "eyebrow": "Disponible dès aujourd'hui", "bg": "linear-gradient(135deg, #0B1D42 0%, #1E3F8A 100%)", "fg": "#F7F4EC", "html": "<div style=\"flex:1;display:flex;flex-direction:column;gap:9.0px\">\n<p style=\"align-self:start;background:#C9962B;color:#0B1D42;font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;padding:2.4px 7.2px;border-radius:299.7px\">Disponible dès aujourd'hui</p>\n<h1 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:34.4px;font-weight:900;line-height:1.08;color:#F7F4EC\">Ton application<br><span style=\"color:#E0B54A\">Profdemaths 2.0</span></h1>\n<p style=\"font-size:16.0px;line-height:1.4;color:#C9D6F0\">Tout le programme de 5e sur ton téléphone, partout et à tout moment : cours rédigés, exercices illimités corrigés pas à pas, quiz et évaluations.</p>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4.2px\"><p style=\"background:#F7F4EC;color:#0B1D42;font-size:14.0px;font-weight:800;padding:3.6px 7.2px;border-radius:299.7px\">Cours</p><span class=\"ga\" style=\"color:#E0B54A\">➜</span><p style=\"background:#F7F4EC;color:#0B1D42;font-size:14.0px;font-weight:800;padding:3.6px 7.2px;border-radius:299.7px\">S'entraîner</p><span class=\"ga\" style=\"color:#E0B54A\">➜</span><p style=\"background:#F7F4EC;color:#0B1D42;font-size:14.0px;font-weight:800;padding:3.6px 7.2px;border-radius:299.7px\">Quiz · 7/10</p><span class=\"ga\" style=\"color:#E0B54A\">➜</span><p style=\"background:#E0B54A;color:#0B1D42;font-size:14.0px;font-weight:800;padding:3.6px 7.2px;border-radius:299.7px\">Évaluation /20</p></div>\n<p style=\"font-size:14.0px;line-height:1.4;color:#F7F4EC\">À la fin de chaque évaluation, j'envoie ma <b style=\"color:#E0B54A\">fiche de résultats</b> à M. Thiam par WhatsApp.</p>\n</div>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:6.0px;background:#FFFDF8;border-radius:9.6px;padding:10.8px;box-shadow:0px 7.2px 19.2px rgba(0,0,0,0.35)\">\n<div class=\"qrbox gqr\" data-qr=\"1\"></div>\n<p style=\"font-family:'Caveat', cursive;font-size:22.9px;font-weight:700;color:#8A6210\">Scanne-moi !</p>\n</div>", "note": ""}, {"id": "journee1", "part": "Les 24 heures de l'élève excellent en sciences", "title": "Le matin : se lever prêt à apprendre", "eyebrow": "Les 24 heures de l'élève excellent en sciences · 1/2", "bg": "#F7F4EC", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">Les 24 heures de l'élève excellent en sciences · 1/2</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">Le matin : se lever prêt à apprendre</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;gap:10.8px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4.2px\">\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:7.2px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:5.4px;padding:4.8px 7.2px\">\n<p style=\"background:#0F2552;color:#E0B54A;font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;text-align:center;padding:2.4px 0px;border-radius:3.6px;white-space:nowrap\">05 h 30</p>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.0px\"><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#0F2552\">Réveil, prière, toilette</h3><p style=\"font-size:12.5px;line-height:1.3;color:#5B6680\">Se lever à heure fixe, même le week-end, règle l'horloge du corps.</p></div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:7.2px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:5.4px;padding:4.8px 7.2px\">\n<p style=\"background:#0F2552;color:#E0B54A;font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;text-align:center;padding:2.4px 0px;border-radius:3.6px;white-space:nowrap\">06 h 00</p>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.0px\"><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#0F2552\">Révision flash · 20 min</h3><p style=\"font-size:12.5px;line-height:1.3;color:#5B6680\">Relire les fiches de la veille : définitions, propriétés, formules.</p></div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:7.2px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:5.4px;padding:4.8px 7.2px\">\n<p style=\"background:#0F2552;color:#E0B54A;font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;text-align:center;padding:2.4px 0px;border-radius:3.6px;white-space:nowrap\">06 h 30</p>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.0px\"><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#0F2552\">Petit déjeuner et sac</h3><p style=\"font-size:12.5px;line-height:1.3;color:#5B6680\">Un vrai petit déjeuner ; vérifier cahiers, instruments, calculatrice.</p></div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:7.2px;background:#FFFDF8;border:1.0px solid #E2D8C3;border-radius:5.4px;padding:4.8px 7.2px\">\n<p style=\"background:#0F2552;color:#E0B54A;font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;text-align:center;padding:2.4px 0px;border-radius:3.6px;white-space:nowrap\">07 h 30</p>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.0px\"><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#0F2552\">Arrivée en avance</h3><p style=\"font-size:12.5px;line-height:1.3;color:#5B6680\">Être à l'heure, c'est déjà être prêt à apprendre.</p></div>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:7.2px;background:#0F2552;border-radius:5.4px;padding:4.8px 7.2px\">\n<p style=\"background:#E0B54A;color:#0B1D42;font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;text-align:center;padding:2.4px 0px;border-radius:3.6px;white-space:nowrap\">08 h – 13 h</p>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.0px\"><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#F7F4EC\">En classe, à fond</h3><p style=\"font-size:12.5px;line-height:1.3;color:#C9D6F0\">Écouter, noter, participer, poser ses questions sur-le-champ.</p></div>\n</div>\n</div>\n<div style=\"display:flex;flex-direction:column;justify-content:space-between;gap:8.4px\">\n<div style=\"display:flex;flex-direction:column;gap:3.0px;background:#1F7A5A;border-radius:7.2px;padding:9.6px 10.8px\">\n<p style=\"font-family:'Montserrat', Arial, sans-serif;font-size:40.2px;font-weight:900;line-height:1;color:#F7F4EC\">20 min</p>\n<p style=\"font-size:13.0px;line-height:1.35;color:#E6F2EC\">de révision flash chaque matin pour réactiver ce que l'on a appris la veille.</p>\n</div>\n<div style=\"display:flex;flex-direction:row;align-items:center\">\n<img src=\"%%LOGO%%\" alt=\"Logo Profdemaths 2.0\" style=\"width:44.0px;height:44.0px;object-fit:cover;border-radius:50%;border:1.2px solid #C9962B;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.25)\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.8px;background:#FFFDF8;border:1.0px solid #C9962B;border-radius:3.6px 12.0px 12.0px 12.0px;padding:6.6px 8.4px;box-shadow:0px 2.4px 7.2px rgba(15,37,82,0.12)\">\n<p style=\"font-family:'Caveat', cursive;font-size:18.0px;font-weight:700;line-height:1.1;color:#8A6210\">Astuce du prof</p>\n<p style=\"font-size:13.0px;line-height:1.35;color:#1B2A4A\">Le matin, l'esprit est frais : c'est le meilleur moment pour relire ses formules.</p>\n</div>\n</div>\n</div>\n</div>", "note": ""}, {"id": "journee2", "part": "Les 24 heures de l'élève excellent en sciences", "title": "L'après-midi et le soir : consolider", "eyebrow": "Les 24 heures de l'élève excellent en sciences · 2/2", "bg": "#EEF2FA", "fg": "#33415C", "html": "<div style=\"display:flex;flex-direction:column;gap:2.4px\">\n<p style=\"font-size:12.5px;font-weight:800;letter-spacing:1.0px;text-transform:uppercase;color:#8A6210\">Les 24 heures de l'élève excellent en sciences · 2/2</p>\n<h2 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:28.6px;font-weight:800;line-height:1.15;color:#0F2552\">L'après-midi et le soir : consolider</h2>\n</div>\n<div style=\"display:flex;flex-direction:row;gap:10.8px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4.2px\">\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:7.2px;background:#FFFDF8;border:1.0px solid #D5DDEE;border-radius:5.4px;padding:4.8px 7.2px\">\n<p style=\"background:#0F2552;color:#E0B54A;font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;text-align:center;padding:2.4px 0px;border-radius:3.6px;white-space:nowrap\">13 h 00</p>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:1.0px\"><h3 style=\"font-family:'Montserrat', Arial, sans-serif;font-size:14.0px;font-weight:800;color:#0F2552\">Déjeuner, prière, repos</
